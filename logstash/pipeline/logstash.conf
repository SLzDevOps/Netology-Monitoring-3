input {
  tcp {
    port => 5000
    codec => json
    type => "docker-json"
  }
  beats {
    port => 5044
  }
}

filter {
  # Распарсим JSON из message, если он там есть
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "parsed_json"
    }
  }
  
  # Добавим метку для различения hot/warm
  mutate {
    add_field => { "node_role" => "hot" }
  }
}

output {
  # Вывод в консоль для отладки (будет видно в docker logs logstash)
  stdout {
    codec => rubydebug
  }
  
  # Отправка в Elasticsearch (hot node)
  elasticsearch {
    hosts => ["http://elasticsearch-hot:9200"]
    index => "docker-logs-%{+YYYY.MM.dd}"
  }
}
