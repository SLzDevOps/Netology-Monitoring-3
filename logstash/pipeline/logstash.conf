input {
  tcp {
    port => 5000
    codec => json
    type => "docker-json"
  }
  beats {
    port => 5044
  }
}

filter {
  # Распарсим JSON, если message содержит JSON строку
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "parsed_json"
    }
  }
  
  # Если есть поле app (от dummy-logger), добавим отдельную метку
  if [parsed_json][app] {
    mutate {
      add_field => { "log_type" => "dummy-app" }
      add_field => { "app_name" => "%{[parsed_json][app]}" }
      add_field => { "log_level" => "%{[parsed_json][level]}" }
      add_field => { "log_message" => "%{[parsed_json][message]}" }
    }
  }
  
  mutate {
    add_field => { "node_role" => "hot" }
  }
}

output {
  # Индекс для docker логов (стандартный)
  elasticsearch {
    hosts => ["http://elasticsearch-hot:9200"]
    index => "docker-logs-%{+YYYY.MM.dd}"
  }
  
  stdout {
    codec => rubydebug
  }
}
